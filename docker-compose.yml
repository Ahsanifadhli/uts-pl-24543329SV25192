# Menjalankan seluruh sistem SPIRA dengan: docker compose up -d --build
services:
  # --- Basis Data MySQL ---
  db:
    image: mysql:8.4
    container_name: spira-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - spira_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Batasi ukuran berkas log container agar tidak membengkak
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Backend Laravel ---
  backend:
    build: ./backend
    container_name: spira-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      LOG_CHANNEL: stdout    # log Laravel keluar ke stdout container
      DB_CONNECTION: mysql
      DB_HOST: db            # terhubung ke basis data lewat nama service
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:8000"
    # Memeriksa endpoint /health yang menguji basis data dan cache.
    # /health membalas 503 bila ada komponen gagal, sehingga wget keluar
    # dengan kode error dan status container menjadi unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Frontend Vue (disajikan Nginx) ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api   # Nginx meneruskan /api ke service backend
    container_name: spira-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ======================================================================
  # Layanan Pemantauan (Observability)
  # ======================================================================

  # --- Prometheus: mengumpulkan dan menyimpan metrik ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: spira-prometheus
    restart: unless-stopped
    depends_on:
      - backend
      - cadvisor
      - node-exporter
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Grafana: menampilkan metrik dalam dashboard ---
  grafana:
    image: grafana/grafana:11.2.0
    container_name: spira-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Password admin diganti dari bawaan admin/admin demi keamanan dasar.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-SpiraGrafana2026}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- cAdvisor: metrik CPU dan memori tiap container ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: spira-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- node-exporter: metrik host (CPU, memori, disk) ---
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: spira-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume agar data tetap bertahan setelah `docker compose down`
volumes:
  spira_db_data:
  prometheus_data:    # data metrik Prometheus
  grafana_data:       # data dan pengaturan Grafana
