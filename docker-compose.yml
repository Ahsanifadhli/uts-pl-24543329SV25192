# Seluruh sistem SPIRA dijalankan dengan: docker compose up -d --build
# Catatan: service backend & frontend akan ditambahkan pada tahap berikutnya.
services:
  # --- Basis Data MySQL ---
  db:
    image: mysql:8.4
    container_name: spira-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - spira_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Named volume agar data basis data tetap bertahan setelah `docker compose down`
volumes:
  spira_db_data:
