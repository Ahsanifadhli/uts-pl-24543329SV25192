# Menjalankan seluruh sistem SPIRA dengan: docker compose up -d --build
services:
  # --- Basis Data MySQL ---
  db:
    image: mysql:8.4
    container_name: spira-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - spira_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Batasi ukuran berkas log container agar tidak membengkak
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Backend Laravel ---
  backend:
    build: ./backend
    container_name: spira-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      LOG_CHANNEL: stdout    # log Laravel keluar ke stdout container
      DB_CONNECTION: mysql
      DB_HOST: db            # terhubung ke basis data lewat nama service
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:8000"
    # Memeriksa endpoint /health yang menguji basis data dan cache.
    # /health membalas 503 bila ada komponen gagal, sehingga wget keluar
    # dengan kode error dan status container menjadi unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Frontend Vue (disajikan Nginx) ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api   # Nginx meneruskan /api ke service backend
    container_name: spira-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume agar data basis data tetap bertahan setelah `docker compose down`
volumes:
  spira_db_data:
