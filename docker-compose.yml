# Menjalankan seluruh sistem SPIRA dengan: docker compose up -d --build
services:
  # --- Basis Data MySQL ---
  db:
    image: mysql:8.4
    container_name: spira-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - spira_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend Laravel ---
  backend:
    build: ./backend
    container_name: spira-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      DB_CONNECTION: mysql
      DB_HOST: db            # terhubung ke basis data lewat nama service
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8000:8000"

  # --- Frontend Vue (disajikan Nginx) ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api   # Nginx meneruskan /api ke service backend
    container_name: spira-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

# Named volume agar data basis data tetap bertahan setelah `docker compose down`
volumes:
  spira_db_data:
